name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/module-13-github-actions

permissions:
  contents: read
  packages: write

jobs:
  hello:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Stage 1 - Source Code Checkout
      # Download repository to GitHub Runner
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Stage 2 - Docker Buildx Setup
      # Enable Docker BuildKit & Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # Stage 3 - Docker Metadata
      # Generate Docker image tags and OCI labels
      # ==========================================
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/frontend
          tags: |
            type=sha
            type=raw,value=latest

      # ==========================================
      # Stage 4 - Runner Verification
      # Verify GitHub Runner Environment
      # ==========================================
      - name: Show Repository Files
        run: ls -la

      - name: Show Current Directory
        run: pwd

      - name: Show GitHub Workspace
        run: echo "$GITHUB_WORKSPACE"

      - name: List Workspace Files
        run: ls -la "$GITHUB_WORKSPACE"

      - name: Show Environment Variables
        run: env | sort

      # ==========================================
      # Stage 5 - Docker Metadata Verification
      # Display generated tags and labels
      # ==========================================
      - name: Show Generated Metadata
        run: |
          echo "================ TAGS ================"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "=============== LABELS ==============="
          echo "${{ steps.meta.outputs.labels }}"

      # ==========================================
      # Stage 6 - Login to GitHub Container Registry
      # Authenticate to GHCR
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Stage 7 - Build & Push Docker Image
      # Build frontend image and push to GHCR
      # ==========================================
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ==========================================
      # Stage 8 - Verify Docker Image
      # Display local Docker images
      # ==========================================
      - name: List Docker Images
        run: docker images

      # ==========================================
      # Stage 9 - Install Trivy CLI
      # Install vulnerability scanner
      # ==========================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/
          trivy --version

      # ==========================================
      # Stage 10 - Trivy Filesystem Scan
      # Scan source code, dependencies and Dockerfile
      # ==========================================
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .

      # ==========================================
      # Stage 11 - Trivy Docker Image Scan
      # Scan the built Docker image
      # ==========================================
      - name: Trivy Docker Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ghcr.io/${{ github.repository_owner }}/frontend:latest