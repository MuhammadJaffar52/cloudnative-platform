name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/module-13-github-actions

permissions:
  contents: read
  packages: write

jobs:
  build:

    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - frontend
          - gateway
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:

      # ==========================================
      # Stage 1 - Source Code Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Stage 2 - Docker Buildx Setup
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # Stage 3 - Show Matrix Service
      # ==========================================
      - name: Show Matrix Service
        run: |
          echo "=================================="
          echo "Building Service: ${{ matrix.service }}"
          echo "=================================="

      # ==========================================
      # Stage 4 - Docker Metadata
      # ==========================================
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      # ==========================================
      # Stage 5 - Runner Verification
      # ==========================================
      - name: Show Repository Files
        run: ls -la

      - name: Show Current Directory
        run: pwd

      - name: Show GitHub Workspace
        run: echo "$GITHUB_WORKSPACE"

      - name: List Workspace Files
        run: ls -la "$GITHUB_WORKSPACE"

      - name: Show Environment Variables
        run: env | sort

      # ==========================================
      # Stage 6 - Docker Metadata Verification
      # ==========================================
      - name: Show Generated Metadata
        run: |
          echo "================ TAGS ================"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "=============== LABELS ==============="
          echo "${{ steps.meta.outputs.labels }}"

      # ==========================================
      # Stage 7 - Login to GitHub Container Registry
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Stage 8 - Build & Push Docker Image
      # ==========================================
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ==========================================
      # Stage 9 - Verify Docker Images
      # ==========================================
      - name: List Docker Images
        run: docker images

      # ==========================================
      # Stage 10 - Install Trivy CLI
      # ==========================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/
          trivy --version

      # ==========================================
      # Stage 11 - Trivy Filesystem Scan
      # ==========================================
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .

      # ==========================================
      # Stage 12 - Trivy Docker Image Scan
      # ==========================================
      - name: Trivy Docker Image Scan
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          echo "Scanning Image: $IMAGE"

          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$IMAGE"