name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/module-13-github-actions
    paths:
      - "apps/**"
      - ".github/workflows/**"

permissions:
  contents: write
  packages: write

jobs:

  # ==========================================
  # Job 1 - Compute Shared Variables (single source of truth)
  # Computed once so build + update-manifests always
  # agree on the exact same tag and owner name —
  # no recomputation, no possibility of drift.
  # ==========================================
  vars:
    name: Compute Image Tag and Owner
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.tag }}
      owner: ${{ steps.vars.outputs.owner }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Variables
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

          echo "Computed image tag: sha-${SHORT_SHA}"
          echo "Computed owner (lowercase): ${OWNER}"

  # ==========================================
  # Job 2 - Build, Scan, Push
  # ==========================================
  build:

    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest
    needs: vars

    strategy:
      fail-fast: false

      matrix:
        service:
          - frontend
          - gateway
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:

      # ==========================================
      # Stage 1 - Source Code Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Stage 2 - Docker Buildx Setup
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # Stage 3 - Show Matrix Service
      # ==========================================
      - name: Show Matrix Service
        run: |
          echo "=================================="
          echo "Building Service: ${{ matrix.service }}"
          echo "Using Tag: ${{ needs.vars.outputs.sha_tag }}"
          echo "Using Owner: ${{ needs.vars.outputs.owner }}"
          echo "=================================="

      # ==========================================
      # Stage 4 - Docker Metadata
      # Tags and owner are driven by the vars job —
      # not recomputed here. Owner is lowercase to
      # comply with GHCR's naming rules.
      # ==========================================
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.vars.outputs.sha_tag }}
            type=raw,value=latest

      # ==========================================
      # Stage 5 - Runner Verification
      # ==========================================
      - name: Show Repository Files
        run: ls -la

      - name: Show Current Directory
        run: pwd

      - name: Show GitHub Workspace
        run: echo "$GITHUB_WORKSPACE"

      - name: List Workspace Files
        run: ls -la "$GITHUB_WORKSPACE"

      - name: Show Environment Variables
        run: env | sort

      # ==========================================
      # Stage 5A - Repository Variable Verification
      # Verify GitHub Repository Variables
      # ==========================================
      - name: Show Repository Variable
        run: |
          echo "Registry = ${{ vars.REGISTRY }}"

      # ==========================================
      # Stage 5B - Repository Secret Verification
      # Verify GitHub Repository Secrets
      # ==========================================
      - name: Verify Repository Secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "✅ Repository Secret Loaded Successfully"
          else
            echo "❌ Repository Secret Not Found"
            exit 1
          fi

      # ==========================================
      # Stage 6 - Docker Metadata Verification
      # ==========================================
      - name: Show Generated Metadata
        run: |
          echo "================ TAGS ================"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "=============== LABELS ==============="
          echo "${{ steps.meta.outputs.labels }}"

      # ==========================================
      # Stage 7 - Login to GitHub Container Registry
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Stage 8 - Build & Push Docker Image
      # ==========================================
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ==========================================
      # Stage 9 - Verify Docker Images
      # ==========================================
      - name: List Docker Images
        run: docker images

      # ==========================================
      # Stage 10 - Install Trivy CLI
      # ==========================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/
          trivy --version

      # ==========================================
      # Stage 11 - Trivy Filesystem Scan
      # ==========================================
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .

      # ==========================================
      # Stage 12 - Trivy Docker Image Scan
      # ==========================================
      - name: Trivy Docker Image Scan
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          echo "Scanning Image: $IMAGE"

          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$IMAGE"

      # ==========================================
      # Stage 13 - Build & Push Approved Image
      # Only publish after successful scans
      # ==========================================
      - name: Build and Push Approved Image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # Job 3 - Update Kubernetes Manifests (CD trigger for ArgoCD)
  # Runs once, after ALL matrix builds succeed.
  # Uses the exact same sha_tag and owner from the
  # vars job — guaranteed to match what was pushed to GHCR.
  # ==========================================
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - vars
      - build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # ==========================================
      # Stage 1 - Update Dev Overlay Tags
      # ==========================================
      - name: Update Dev Overlay Tags
        env:
          NEW_TAG: ${{ needs.vars.outputs.sha_tag }}
        run: |
          set -e

          FILE="kubernetes/overlays/dev/kustomization.yaml"

          sed -i "0,/name: ghcr.io\/muhammadjaffar52\/frontend/{n;s/newTag:.*/newTag: ${NEW_TAG}/;}" $FILE
          sed -i "0,/name: ghcr.io\/muhammadjaffar52\/gateway/{n;s/newTag:.*/newTag: ${NEW_TAG}/;}" $FILE
          sed -i "0,/name: ghcr.io\/muhammadjaffar52\/user-service/{n;s/newTag:.*/newTag: ${NEW_TAG}/;}" $FILE
          sed -i "0,/name: ghcr.io\/muhammadjaffar52\/product-service/{n;s/newTag:.*/newTag: ${NEW_TAG}/;}" $FILE
          sed -i "0,/name: ghcr.io\/muhammadjaffar52\/order-service/{n;s/newTag:.*/newTag: ${NEW_TAG}/;}" $FILE
          sed -i "0,/name: ghcr.io\/muhammadjaffar52\/payment-service/{n;s/newTag:.*/newTag: ${NEW_TAG}/;}" $FILE

      # ==========================================
      # Stage 2 - Show Diff
      # ==========================================
      - name: Show Manifest Changes
        run: git diff --color=always kubernetes/overlays/dev/

      # ==========================================
      # Stage 3 - Commit and Push Updated Manifests
      # Note: paths trigger above already excludes
      # kubernetes/**, so this commit back to main
      # won't re-trigger the pipeline.
      #
      # git pull --rebase before the push guards against
      # another commit landing on this branch while the
      # workflow was running (e.g. a manual push, or a
      # concurrent workflow run), which would otherwise
      # cause a non-fast-forward rejection here.
      # ==========================================
      - name: Commit and Push Changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet kubernetes/overlays/dev/; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add kubernetes/overlays/dev/
          git commit -m "ci: update image tags to ${{ needs.vars.outputs.sha_tag }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}