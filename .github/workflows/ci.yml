name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/module-13-github-actions
    paths-ignore:
      - "kubernetes/**"

permissions:
  contents: write
  packages: write

jobs:

  # ==========================================
  # Job 1 - Compute Image Tag (single source of truth)
  # Computed once so build + update-manifests always
  # agree on the exact same tag — no recomputation,
  # no possibility of drift between them.
  # ==========================================
  vars:
    name: Compute Image Tag
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Short SHA Tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Computed image tag: sha-${SHORT_SHA}"

  # ==========================================
  # Job 2 - Build, Scan, Push
  # ==========================================
  build:

    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest
    needs: vars

    strategy:
      fail-fast: false

      matrix:
        service:
          - frontend
          - gateway
          - user-service
          - product-service
          - order-service
          - payment-service

    steps:

      # ==========================================
      # Stage 1 - Source Code Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Stage 2 - Docker Buildx Setup
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # Stage 3 - Show Matrix Service
      # ==========================================
      - name: Show Matrix Service
        run: |
          echo "=================================="
          echo "Building Service: ${{ matrix.service }}"
          echo "Using Tag: ${{ needs.vars.outputs.sha_tag }}"
          echo "=================================="

      # ==========================================
      # Stage 4 - Docker Metadata
      # Tags are driven by the single sha_tag computed
      # in the vars job — not recomputed here.
      # ==========================================
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.vars.outputs.sha_tag }}
            type=raw,value=latest

      # ==========================================
      # Stage 5 - Runner Verification
      # ==========================================
      - name: Show Repository Files
        run: ls -la

      - name: Show Current Directory
        run: pwd

      - name: Show GitHub Workspace
        run: echo "$GITHUB_WORKSPACE"

      - name: List Workspace Files
        run: ls -la "$GITHUB_WORKSPACE"

      - name: Show Environment Variables
        run: env | sort

      # ==========================================
      # Stage 5A - Repository Variable Verification
      # Verify GitHub Repository Variables
      # ==========================================
      - name: Show Repository Variable
        run: |
          echo "Registry = ${{ vars.REGISTRY }}"

      # ==========================================
      # Stage 5B - Repository Secret Verification
      # Verify GitHub Repository Secrets
      # ==========================================
      - name: Verify Repository Secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "✅ Repository Secret Loaded Successfully"
          else
            echo "❌ Repository Secret Not Found"
            exit 1
          fi

      # ==========================================
      # Stage 6 - Docker Metadata Verification
      # ==========================================
      - name: Show Generated Metadata
        run: |
          echo "================ TAGS ================"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "=============== LABELS ==============="
          echo "${{ steps.meta.outputs.labels }}"

      # ==========================================
      # Stage 7 - Login to GitHub Container Registry
      # ==========================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Stage 8 - Build & Push Docker Image
      # ==========================================
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ==========================================
      # Stage 9 - Verify Docker Images
      # ==========================================
      - name: List Docker Images
        run: docker images

      # ==========================================
      # Stage 10 - Install Trivy CLI
      # ==========================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv ./bin/trivy /usr/local/bin/
          trivy --version

      # ==========================================
      # Stage 11 - Trivy Filesystem Scan
      # ==========================================
      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .

      # ==========================================
      # Stage 12 - Trivy Docker Image Scan
      # ==========================================
      - name: Trivy Docker Image Scan
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          echo "Scanning Image: $IMAGE"

          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$IMAGE"

      # ==========================================
      # Stage 13 - Build & Push Approved Image
      # Only publish after successful scans
      # ==========================================
      - name: Build and Push Approved Image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # Job 3 - Update Kubernetes Manifests (CD trigger for ArgoCD)
  # Runs once, after ALL matrix builds succeed.
  # Uses the exact same sha_tag from the vars job —
  # guaranteed to match what was pushed to GHCR.
  # ==========================================
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - vars
      - build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # ==========================================
      # Stage 1 - Update Image Tags in Deployment Manifests
      # Regex matches the image line regardless of the
      # previous registry (localhost:5001, ghcr.io, etc.)
      # or previous tag (1.0, latest, sha-xxxxxxx, ...).
      # ==========================================
      - name: Update Deployment Image Tags
        env:
          NEW_TAG: ${{ needs.vars.outputs.sha_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          declare -A SERVICES=(
            [frontend]="kubernetes/base/frontend/deployment.yaml"
            [gateway]="kubernetes/base/gateway/deployment.yaml"
            [user-service]="kubernetes/base/user-service/deployment.yaml"
            [product-service]="kubernetes/base/product-service/deployment.yaml"
            [order-service]="kubernetes/base/order-service/deployment.yaml"
            [payment-service]="kubernetes/base/payment-service/deployment.yaml"
          )

          for service in "${!SERVICES[@]}"; do
            file="${SERVICES[$service]}"
            echo "Updating ${file} -> ghcr.io/${OWNER}/${service}:${NEW_TAG}"

            sed -i -E \
              "s#image:.*${service}:.*#image: ghcr.io/${OWNER}/${service}:${NEW_TAG}#" \
              "$file"
          done

      # ==========================================
      # Stage 2 - Show Diff
      # ==========================================
      - name: Show Manifest Changes
        run: git diff --color=always kubernetes/base/

      # ==========================================
      # Stage 3 - Commit and Push Updated Manifests
      # Note: paths-ignore on kubernetes/** at the top
      # of this workflow prevents this push from
      # re-triggering the pipeline.
      # ==========================================
      - name: Commit and Push Changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet kubernetes/base/; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add kubernetes/base/
          git commit -m "ci: update image tags to ${{ needs.vars.outputs.sha_tag }}"
          git push origin HEAD:${{ github.ref_name }}