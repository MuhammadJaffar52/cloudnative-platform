apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service
  namespace: microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service
     
    spec:
      serviceAccountName: app-sa
    
      containers:
        - name: product-service

          image: localhost:5001/product-service:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3002

          envFrom:
            - configMapRef:
                name: product-service-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3002

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3002

            initialDelaySeconds: 15
            periodSeconds: 20