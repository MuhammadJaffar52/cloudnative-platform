apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
   

    metadata:
      labels:
        app: payment-service

    spec:
      serviceAccountName: app-sa

  

      containers:

        - name: payment-service

          image: ghcr.io/muhammadjaffar52/payment-service:sha-09bf05d
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3004


          envFrom:

            - configMapRef:
                name: payment-service-config


          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"


          readinessProbe:

            httpGet:
              path: /health
              port: 3004

            initialDelaySeconds: 5
            periodSeconds: 10


          livenessProbe:

            httpGet:
              path: /health
              port: 3004

            initialDelaySeconds: 15
            periodSeconds: 20