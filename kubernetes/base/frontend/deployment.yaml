apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: microservices

spec:
  replicas: 4

  selector:
    matchLabels:
      app: frontend
      

  template:
    metadata:
      labels:
        app: frontend
        version: stable

    spec:
      serviceAccountName: app-sa

      containers:
        - name: frontend
          image: ghcr.io/muhammadjaffar52/frontend:sha-8c31266

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: frontend-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20