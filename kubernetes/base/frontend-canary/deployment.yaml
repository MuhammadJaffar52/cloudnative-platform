apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-canary
  namespace: microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

      version: canary

  template:
    metadata:
      labels:
        app: frontend
        version: canary

    spec:
      serviceAccountName: app-sa

      containers:
        - name: frontend
          image: ghcr.io/muhammadjaffar52/frontend:sha-d229b54
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: frontend-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20