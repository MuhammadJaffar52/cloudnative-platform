apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"

    spec:
      serviceAccountName: app-sa

      containers:
        - name: order-service
          image: ghcr.io/muhammadjaffar52/order-service:sha-1350ae1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3003

          envFrom:
            - configMapRef:
                name: order-service-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20