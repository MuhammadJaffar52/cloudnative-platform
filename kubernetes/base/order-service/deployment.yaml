apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: microservices


spec:

  replicas: 1


  selector:

    matchLabels:

      app: order-service


  template:

    metadata:

      labels:

        app: order-service


    spec:

      containers:


        - name: order-service


          image: localhost:5001/order-service:1.0

          imagePullPolicy: IfNotPresent


          ports:

            - containerPort: 3003


          envFrom:

            - configMapRef:

                name: order-service-config



          resources:


            requests:

              cpu: "100m"

              memory: "128Mi"


            limits:

              cpu: "250m"

              memory: "256Mi"



          readinessProbe:

            httpGet:

              path: /health

              port: 3003


            initialDelaySeconds: 5

            periodSeconds: 10



          livenessProbe:

            httpGet:

              path: /health

              port: 3003


            initialDelaySeconds: 15

            periodSeconds: 20