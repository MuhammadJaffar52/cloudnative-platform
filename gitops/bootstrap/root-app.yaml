apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://github.com/MuhammadJaffar52/cloudnative-platform.git
    targetRevision: main
    path: gitops/applications/workloads

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true